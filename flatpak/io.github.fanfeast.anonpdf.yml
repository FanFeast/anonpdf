id: io.github.fanfeast.anonpdf
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk17
command: anonpdf

finish-args:
  # No --share=network: the sandbox gives the app no network at all.
  # The Java toolkit draws through X11 (XWayland on a Wayland desktop).
  - --socket=x11
  - --share=ipc
  - --device=dri
  # Java's file dialogs don't go through the portal, so the folders they show
  # are the ones the app can reach: where documents usually are, and where
  # copies get saved. Not the whole home folder. A file opened from the file
  # manager, or dragged onto the window, comes in through the document portal
  # from anywhere.
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=xdg-desktop
  - --filesystem=xdg-pictures

modules:
  - name: anonpdf
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/openjdk17/bin
      env:
        JAVA_HOME: /usr/lib/sdk/openjdk17/jvm/openjdk-17
        GRADLE_USER_HOME: /run/build/anonpdf/gradle-home
    build-commands:
      # The same release build as the portable download: shrunk with ProGuard,
      # with a trimmed Java runtime of its own.
      - >-
        gradle/bin/gradle --offline --no-daemon
        --init-script flatpak/offline.init.gradle.kts
        -Panonpdf.desktopOnly=true -Pkotlin.compiler.execution.strategy=in-process
        -PappVersion=1.1.0
        :desktop:createReleaseDistributable
      - mkdir -p /app/lib /app/bin
      - cp -a desktop/build/compose/binaries/main-release/app/AnonPDF /app/lib/AnonPDF
      # The bundled runtime has no java command, since the packager's launcher
      # loads the JVM itself. Rebuild it with the same modules plus that command,
      # and start the app through it: see make-launcher.sh.
      - >-
        modules=$(sed -n 's/^MODULES="\(.*\)"/\1/p' /app/lib/AnonPDF/lib/runtime/release | tr ' ' ,)
        && rm -rf /app/lib/AnonPDF/lib/runtime
        && jlink --add-modules "$modules" --strip-debug --no-header-files --no-man-pages
        --output /app/lib/AnonPDF/lib/runtime
        && find /app/lib/AnonPDF/lib/runtime/bin -type f ! -name java -delete
      - sh flatpak/make-launcher.sh /app/lib/AnonPDF > /app/bin/anonpdf
      - chmod 755 /app/bin/anonpdf
      # ProGuard can break PDFBox without breaking the build; this runs the
      # riskiest paths in the installed app.
      - /app/bin/anonpdf --self-test
      - install -Dm644 flatpak/io.github.fanfeast.anonpdf.desktop -t /app/share/applications
      - install -Dm644 flatpak/io.github.fanfeast.anonpdf.metainfo.xml -t /app/share/metainfo
      - install -Dm644 desktop/packaging/anonpdf.png /app/share/icons/hicolor/512x512/apps/io.github.fanfeast.anonpdf.png
    sources:
      - type: git
        url: https://github.com/FanFeast/anonpdf.git
        # The release being published; appVersion above and the newest
        # <release> in the metainfo move with it.
        tag: v1.1.0
      - type: archive
        url: https://services.gradle.org/distributions/gradle-9.6.1-bin.zip
        sha256: 9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14
        dest: gradle
      - maven-sources.json
