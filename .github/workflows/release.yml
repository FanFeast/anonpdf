name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Signing material comes from repository secrets. Two keys, because Play signs
# the copy it installs with the app signing key it holds, and takes uploads
# signed with a separate upload key that it can reset if that one is lost:
#
#   KEYSTORE_BASE64   the app signing key (base64 -w0 upload.jks). It signs the
#   KEYSTORE_PASSWORD APK attached to the GitHub release, so that APK and the
#   KEY_ALIAS         Play copy are the same app and update each other. Play
#   KEY_PASSWORD      holds the same key.
#
#   PLAY_UPLOAD_KEYSTORE_BASE64   the upload key, which signs the bundle (.aab)
#   PLAY_UPLOAD_KEYSTORE_PASSWORD that goes to Play.
#   PLAY_UPLOAD_KEY_ALIAS
#   PLAY_UPLOAD_KEY_PASSWORD
#
# Without the app signing key the job still runs and produces an unsigned APK,
# which is fine for testing but cannot be uploaded to Play. Without the upload
# key the bundle is signed with the app signing key.

jobs:
  release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The `secrets` context is not usable directly in a step-level `if`, so
      # reduce it to a job-level boolean here.
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      HAS_UPLOAD_KEY: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing material
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/app-signing.jks"
          cat > "$RUNNER_TEMP/app-signing.properties" <<EOF
          storeFile=$RUNNER_TEMP/app-signing.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Restore the Play upload key
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/play-upload.jks"
          cat > "$RUNNER_TEMP/play-upload.properties" <<EOF
          storeFile=$RUNNER_TEMP/play-upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      # The build reads keystore.properties when it starts, so each output gets
      # its own run with its own key.
      - name: Build bundle and APK
        run: |
          set -euo pipefail
          use_key() { if [ -f "$1" ]; then cp "$1" keystore.properties; fi; }
          use_key "$RUNNER_TEMP/app-signing.properties"
          use_key "$RUNNER_TEMP/play-upload.properties"
          ./gradlew bundleRelease
          rm -f keystore.properties
          use_key "$RUNNER_TEMP/app-signing.properties"
          ./gradlew assembleRelease

      # A swapped key fails nothing else: Play would just reject the upload, or the
      # GitHub APK would stop updating the Play copy. The fingerprints are public.
      - name: Confirm which key signed what
        if: env.HAS_KEYSTORE == 'true'
        run: |
          set -euo pipefail
          APP_KEY=04:D8:41:F0:9D:DC:BE:14:B0:95:64:20:66:F0:08:5C:FF:5B:08:1A:7E:28:9B:CF:24:3D:7E:C9:EE:C6:24:FE
          UPLOAD_KEY=9E:E2:69:BD:6C:41:E8:76:27:03:4C:1A:D0:E3:14:A8:B6:12:2C:58:85:7F:96:A4:9A:8C:FF:B9:A2:2C:4A:C0
          # The APK has only v2/v3 signatures, which keytool can't read; the
          # bundle is JAR-signed, which apksigner won't read.
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          APK=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | sed 's/../&:/g; s/:$//' | tr a-f A-F)
          AAB=$(keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab \
            | sed -n 's/^\s*SHA256: //p' | head -1)
          [ "$APK" = "$APP_KEY" ] || { echo "The APK is not signed with the app signing key: $APK"; exit 1; }
          if [ "$HAS_UPLOAD_KEY" = true ]; then WANT=$UPLOAD_KEY; else WANT=$APP_KEY; fi
          [ "$AAB" = "$WANT" ] || { echo "The bundle is signed with the wrong key: $AAB"; exit 1; }
          echo "APK: app signing key. Bundle: $([ "$WANT" = "$UPLOAD_KEY" ] && echo upload || echo 'app signing') key."

      - name: Confirm the release build has no network access
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          FOUND=$("$AAPT" dump permissions "$APK" \
            | grep '^uses-permission' \
            | grep -vE 'MANAGE_EXTERNAL_STORAGE|DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION' \
            || true)
          if [ -n "$FOUND" ]; then
            echo "Unexpected permissions in the release manifest:"; echo "$FOUND"; exit 1
          fi
          NETWORK=$("$AAPT" dump permissions "$APK" \
            | grep -E 'INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE' || true)
          if [ -n "$NETWORK" ]; then
            echo "Network permission in a release build:"; echo "$NETWORK"; exit 1
          fi
          echo "Release permissions are as reviewed, and no network access."

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP"/*.jks "$RUNNER_TEMP"/*.properties

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anonpdf-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          # v1.0.0-rc.1 and the like are candidates, not the latest release.
          prerelease: ${{ contains(github.ref_name, '-') }}

  desktop:
    # The portable desktop downloads, attached to the same release as the APK.
    name: Desktop downloads (${{ matrix.os }})
    # After the APK job, which creates the release: two jobs creating the same
    # release at once can race.
    needs: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        shell: bash
        run: |
          # v1.2.0-rc.1 -> files say 1.2.0-rc.1; the app itself says 1.2.0, since
          # jpackage takes plain numbers only.
          NAME="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || NAME="dev-${GITHUB_SHA::7}"
          NUMERIC="$(echo "$NAME" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' || echo 1.0.0)"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "numeric=$NUMERIC" >> "$GITHUB_OUTPUT"

      - name: Package the release build
        shell: bash
        run: ./gradlew :desktop:createReleaseDistributable -PappVersion=${{ steps.version.outputs.numeric }}

      - name: Self-test and build the Linux download
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          desktop/packaging/linux/build-appimage.sh "${{ steps.version.outputs.name }}" dist
          mkdir unpacked && tar -C unpacked -xzf dist/*.tar.gz
          APPIMAGE_EXTRACT_AND_RUN=1 unpacked/*/AnonPDF.AppImage --self-test

      - name: Self-test and build the Windows download
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "desktop/build/compose/binaries/main-release/app/AnonPDF/AnonPDF.exe"
          $run = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow
          if ($run.ExitCode -ne 0) { throw "Self-test failed with exit code $($run.ExitCode)" }
          ./desktop/packaging/windows/build-zip.ps1 -Version "${{ steps.version.outputs.name }}" -Out dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anonpdf-desktop-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
