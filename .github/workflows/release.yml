name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Signing material comes from repository secrets, which must be set before this
# workflow can produce an uploadable bundle:
#
#   KEYSTORE_BASE64   base64 of your upload keystore  (base64 -w0 upload.jks)
#   KEYSTORE_PASSWORD store password
#   KEY_ALIAS         key alias
#   KEY_PASSWORD      key password
#
# Without them the job still runs and produces an unsigned APK, which is fine
# for testing but cannot be uploaded to Play.

jobs:
  release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The `secrets` context is not usable directly in a step-level `if`, so
      # reduce it to a job-level boolean here.
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing material
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build bundle and APK
        run: ./gradlew bundleRelease assembleRelease

      - name: Confirm the release build has no network access
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          FOUND=$("$AAPT" dump permissions "$APK" \
            | grep '^uses-permission' \
            | grep -vE 'MANAGE_EXTERNAL_STORAGE|DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION' \
            || true)
          if [ -n "$FOUND" ]; then
            echo "Unexpected permissions in the release manifest:"; echo "$FOUND"; exit 1
          fi
          NETWORK=$("$AAPT" dump permissions "$APK" \
            | grep -E 'INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE' || true)
          if [ -n "$NETWORK" ]; then
            echo "Network permission in a release build:"; echo "$NETWORK"; exit 1
          fi
          echo "Release permissions are as reviewed, and no network access."

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/upload.jks"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anonpdf-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          # v1.0.0-rc.1 and the like are candidates, not the latest release.
          prerelease: ${{ contains(github.ref_name, '-') }}

  desktop:
    # The portable desktop downloads, attached to the same release as the APK.
    name: Desktop downloads (${{ matrix.os }})
    # After the APK job, which creates the release: two jobs creating the same
    # release at once can race.
    needs: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        shell: bash
        run: |
          # v1.2.0-rc.1 -> files say 1.2.0-rc.1; the app itself says 1.2.0, since
          # jpackage takes plain numbers only.
          NAME="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || NAME="dev-${GITHUB_SHA::7}"
          NUMERIC="$(echo "$NAME" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' || echo 1.0.0)"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "numeric=$NUMERIC" >> "$GITHUB_OUTPUT"

      - name: Package the release build
        shell: bash
        run: ./gradlew :desktop:createReleaseDistributable -PappVersion=${{ steps.version.outputs.numeric }}

      - name: Self-test and build the Linux download
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          desktop/packaging/linux/build-appimage.sh "${{ steps.version.outputs.name }}" dist
          mkdir unpacked && tar -C unpacked -xzf dist/*.tar.gz
          APPIMAGE_EXTRACT_AND_RUN=1 unpacked/*/AnonPDF.AppImage --self-test

      - name: Self-test and build the Windows download
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "desktop/build/compose/binaries/main-release/app/AnonPDF/AnonPDF.exe"
          $run = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow
          if ($run.ExitCode -ne 0) { throw "Self-test failed with exit code $($run.ExitCode)" }
          ./desktop/packaging/windows/build-zip.ps1 -Version "${{ steps.version.outputs.name }}" -Out dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anonpdf-desktop-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
